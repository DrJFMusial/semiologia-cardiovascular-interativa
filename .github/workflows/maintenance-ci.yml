name: Validar pull request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:all
      - run: node scripts/check-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: previa-manutencao
          path: |
            dist/
            dist-offline/
