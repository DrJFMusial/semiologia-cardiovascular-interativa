<section class="s-check" data-section="Fechamento" data-menu-title="Checklist da estação">
  <header class="slide-head compact">
    <p class="eyebrow">Na estação de prática</p>
    <h2>Checklist: um examina, o outro acompanha; depois trocam</h2>
  </header>
  <form class="checklist fill" data-component="checklist" onsubmit="return false">
    <fieldset>
      <legend>Abordagem e vasos</legend>
      <label><input type="checkbox">Higieniza as mãos, apresenta-se, explica e pede permissão</label>
      <label><input type="checkbox">Garante privacidade e expõe só o necessário</label>
      <label><input type="checkbox">Posiciona o paciente e coloca-se à direita</label>
      <label><input type="checkbox">Mede a pressão arterial com preparo e técnica corretos</label>
      <label><input type="checkbox">Palpa o pulso radial por 1 minuto: frequência, ritmo, amplitude</label>
      <label><input type="checkbox">Compara pulsos periféricos dos dois lados</label>
      <label><input type="checkbox">Palpa uma carótida de cada vez</label>
      <label><input type="checkbox">Observa as jugulares a 45° e estima a pressão venosa</label>
    </fieldset>
    <fieldset>
      <legend>Precórdio, periferia e registro</legend>
      <label><input type="checkbox">Inspeciona o precórdio de forma tangencial e frontal</label>
      <label><input type="checkbox">Percute do 3º ao 5º EIC: som claro e maciço</label>
      <label><input type="checkbox">Localiza o ictus e descreve localização e extensão</label>
      <label><input type="checkbox">Palpa com a palma: impulsões e frêmitos</label>
      <label><input type="checkbox">Ausculta os cinco focos e todo o precórdio, com diafragma e campânula</label>
      <label><input type="checkbox">Sincroniza a ausculta com o pulso carotídeo</label>
      <label><input type="checkbox">Ausculta em decúbito lateral esquerdo e inclinado para a frente</label>
      <label><input type="checkbox">Pesquisa edema nos membros inferiores</label>
      <label><input type="checkbox">Registra o exame no prontuário, do normal ao alterado</label>
    </fieldset>
    <div class="ck-bar"><span class="ck-count"></span><span class="ck-prog" aria-hidden="true"></span><button type="button" class="btn ghost ck-reset">Limpar</button></div>
  </form>
  <aside class="notes">As marcações não são salvas: servem para a dupla acompanhar a execução. (1 min)</aside>
</section>
